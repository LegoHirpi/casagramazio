<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La nostra casa</title>
<meta name="theme-color" content="#1b2435">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Casa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html,body{margin:0;height:100%;background:#1b2435;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;height:100dvh;border:0;display:block}
  #wait{position:fixed;inset:0;display:grid;place-items:center;font:16px system-ui,sans-serif;color:#c9cfdb}
  #wait img{width:96px;height:96px;display:block;margin:0 auto 14px;border-radius:22px}
</style>
</head>
<body>
<div id="wait"><div><img src="icons/icon-192.png" alt=""><div>Caricamento…</div></div></div>
<script>
  /* ⬇️ INCOLLA QUI il link della webapp (Esegui il deployment → App web), quello che finisce con /exec */
  var APP_URL = 'https://script.google.com/macros/s/AKfycbyHCaT7lIEZhchnoiKaXouJFLf8N8gcTq402I_2xkGTDF5jtVO-ofbN2byQR798fwHC_A/exec';

  var f = document.createElement('iframe');
  f.src = APP_URL;
  f.title = 'La nostra casa';
  f.allow = 'clipboard-write';
  f.onload = function(){ var w=document.getElementById('wait'); if(w) w.remove(); };
  document.body.appendChild(f);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
