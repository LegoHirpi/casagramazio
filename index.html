<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>La nostra casa</title>
<meta name="theme-color" content="#1b2435">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Casa">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#f3eee6; --card:#fffdf9; --ink:#1b2435; --muted:#6b6f7a; --line:#e4dccf;
  --nav:#1b2435; --navInk:#f6efe3; --primary:#1b2435; --primaryInk:#ffffff;
  --accent:#b8681a; --accent-soft:#fbecd3; --glow:#f2b04c;
  --green:#2f7d4f; --green-soft:#e1f0e6; --blue:#2c5d9e; --blue-soft:#e3ebf7;
  --violet:#6a4aa5; --violet-soft:#ece6f7; --danger:#b83227; --danger-soft:#f8e1de;
  --olive:#5f6a22; --olive-soft:#eef0dc; --stone:#7d6343; --stone-soft:#f1e8dc;
  --shadow:0 1px 2px rgba(27,36,53,.06),0 6px 18px rgba(27,36,53,.06); --r:18px;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#121826; --card:#1c2435; --ink:#eef1f6; --muted:#9aa3b5; --line:#2c3549;
  --nav:#0d1220; --navInk:#f6efe3; --primary:#f2b04c; --primaryInk:#1b2435;
  --accent:#f2b04c; --accent-soft:#3a2f1c; --glow:#f2b04c;
  --green:#6fcf97; --green-soft:#1a3326; --blue:#86b4f0; --blue-soft:#1c2b44;
  --violet:#b99af0; --violet-soft:#2a2340; --danger:#ff8a7a; --danger-soft:#3e2120;
  --olive:#c2cd76; --olive-soft:#2a2f1a; --stone:#d9bb92; --stone-soft:#33291d;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;transition:background .3s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
input[type=checkbox]{accent-color:var(--green)}
header.top{position:sticky;top:0;z-index:20;background:var(--nav);color:var(--navInk);box-shadow:0 2px 10px rgba(0,0,0,.15);padding-top:env(safe-area-inset-top)}
header.top .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:10px 16px}
header.top h1{font-size:19px;margin:0;flex:1;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .star{color:var(--glow)}
.iconbtn{border:0;background:rgba(255,255,255,.1);color:inherit;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none}
.card .iconbtn,.calhead .iconbtn{background:var(--bg);color:var(--ink)}
.app{max-width:760px;margin:0 auto;padding:14px 16px 96px}

/* home */
.hello{font-size:27px;font-weight:750;letter-spacing:-.02em;margin:4px 0 0}
.datebig{color:var(--muted);margin-bottom:14px}
.today-card{background:var(--nav);color:var(--navInk);border-radius:var(--r);padding:16px;margin:0 0 14px;position:relative;overflow:hidden}
:root[data-theme=dark] .today-card{background:var(--card)}
.today-card h2{margin:0 0 10px;font-size:17px;display:flex;align-items:center;gap:8px}
.today-card h2 .dot{width:10px;height:10px;border-radius:50%;background:var(--glow);box-shadow:0 0 12px var(--glow)}
.tsec{display:flex;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,.12)}
:root[data-theme=dark] .tsec{border-top-color:var(--line)}
.tsec .ti{width:24px;flex:none;text-align:center}
.tsec .tb{flex:1;min-width:0;font-size:14.5px}
.tsec .tb .lb{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;opacity:.7;font-weight:700}
.tsec .late{color:#ff9d8c;font-weight:600}
.tsec button.lnk{border:0;background:none;padding:0;color:inherit;text-align:left;font:inherit;display:block;width:100%}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;text-align:left;background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-height:124px;display:flex;flex-direction:column;gap:5px}
.tile .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:21px}
.tile b{font-size:17px}
.tile small{color:var(--muted);font-size:12.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.c-menu .ic{background:var(--accent-soft)} .c-agenda .ic{background:var(--blue-soft)} .c-spesa .ic{background:var(--green-soft)}
.c-todo .ic{background:var(--violet-soft)} .c-ricette .ic{background:var(--stone-soft)} .c-scadenze .ic{background:var(--danger-soft)} .c-bambini .ic{background:var(--olive-soft)} .c-budget .ic{background:var(--green-soft)}
.namecard{background:var(--card);border-radius:var(--r);padding:14px;margin:0 0 14px;box-shadow:var(--shadow);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.namecard span{flex:1 1 100%;font-size:14px;color:var(--muted)}

/* generic */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:0 0 12px}
.card h2{margin:0 0 10px;font-size:18px}
.card h3{margin:0 0 8px;font-size:16px}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:8px;align-items:center;justify-content:space-between}
.grow{flex:1}
.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--card);box-shadow:var(--shadow);font-weight:600;color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--primary);color:var(--primaryInk);box-shadow:none}
.btn.ghost{background:transparent;box-shadow:none;border:1px solid var(--line)}
.btn.danger{color:var(--danger)}
.btn.danger.sure{background:var(--danger);color:#fff}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
input[type=text],input[type=date],input[type=time],input[type=number],input[type=tel],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;min-height:44px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--glow);outline-offset:0;border-color:transparent}
textarea{min-height:80px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin:10px 0 0}
.chk input{width:20px;height:20px;margin:0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.chip.green{background:var(--green-soft);color:var(--green)} .chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.red{background:var(--danger-soft);color:var(--danger)} .chip.gray{background:var(--bg);color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:14px;white-space:nowrap;font-weight:500}
.pill.on{background:var(--primary);color:var(--primaryInk);border-color:var(--primary)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.sep{height:1px;background:var(--line);margin:12px 0}

/* menu */
.mhead{margin:4px 0 12px}
.mhead .big{font-size:26px;font-weight:750;letter-spacing:-.02em}
.mhead .big em{font-style:normal;color:var(--accent)}
.daynav{display:flex;gap:8px;margin:0 0 12px}
.daynav .btn{flex:1}
.meal .lab{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
.meal .txt{font-size:17px}
.meal .src{font-size:12.5px;color:var(--accent);margin-top:6px}
.meal .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.meal.alt{outline:2px solid var(--glow)}
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
.bigbtns .btn{padding:13px 10px;font-size:15px}

/* meal plan */
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}
.tab{border:0;background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;box-shadow:var(--shadow);white-space:nowrap;color:var(--ink)}
.tab.on{background:var(--primary);color:var(--primaryInk)}
.pday h3{margin:0 0 8px;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pday.today{outline:2px solid var(--glow)}
.pday dl{margin:0;display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14.5px}
.pday dt{color:var(--muted);font-size:12.5px;font-weight:600;padding-top:2px}
.pday dd{margin:0}
.swp{color:var(--accent);font-size:12px}

/* agenda */
.up-day{margin:0 0 10px}
.up-day .d{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
.ev{display:flex;gap:10px;align-items:flex-start;border:0;width:100%;text-align:left;background:var(--bg);border-radius:12px;padding:10px 12px;margin:0 0 6px;border-left:5px solid var(--evc,#039be5);color:var(--ink)}
.ev .t{font-size:13px;font-weight:700;min-width:46px}
.ev .n{font-weight:600}
.ev .x{font-size:12.5px;color:var(--muted)}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.calhead h2{flex:1;margin:0;font-size:19px;text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.grid .wd{font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;padding:2px 0 4px}
.cell{background:transparent;border-radius:10px;min-height:64px;padding:3px;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden;border:1px solid var(--line);color:var(--ink)}
.cell.out{opacity:.4}
.cell .num{font-size:13px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cell.today .num{background:var(--primary);color:var(--primaryInk)}
.cell.sel{border-color:var(--glow);background:var(--accent-soft)}
.cell .e{font-size:10.5px;line-height:1.25;background:var(--evc,#039be5);color:#fff;border-radius:4px;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .e.lt{color:#1b2435}
.cell .more{font-size:10px;color:var(--muted)}
@media (min-width:600px){.cell{min-height:88px}.cell .e{font-size:12px}}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.catpick{display:flex;flex-wrap:wrap;gap:6px}
.catpick button{border:2px solid transparent;border-radius:999px;padding:6px 11px;font-size:13.5px;font-weight:600;background:var(--bg);color:var(--ink)}
.catpick button.on{border-color:var(--ink)}
.catpick button i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}

/* liste */
.addrow{display:flex;gap:8px;align-items:stretch;position:relative}
.addrow .main{flex:1;min-width:0}
.addrow input.qty{width:72px;flex:none;padding:10px 8px}
.addrow select.unit{width:72px;flex:none;padding:10px 4px 10px 8px}
.ac{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.18);z-index:30;overflow:hidden;max-height:340px;overflow-y:auto}
.ac button{display:flex;width:100%;justify-content:space-between;gap:10px;align-items:center;border:0;background:transparent;padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);color:var(--ink)}
.ac button:last-child{border-bottom:0}
.ac button.act,.ac button:hover{background:var(--accent-soft)}
.ac button small{color:var(--muted);font-size:12px;white-space:nowrap}
.ac button.new{color:var(--accent);font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.grp{padding:0;overflow:hidden}
.grp-h{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:8px;padding:13px 16px;font-weight:700;text-align:left;color:var(--ink)}
.grp-h .cnt{margin-left:auto;font-size:13px;color:var(--muted);font-weight:600}
.grp-h .car{transition:transform .15s;color:var(--muted)}
.grp.closed .car{transform:rotate(-90deg)}
.grp.closed .items{display:none}
.item{display:flex;align-items:center;gap:12px;padding:9px 16px;border-top:1px solid var(--line)}
.item input[type=checkbox]{width:24px;height:24px;accent-color:var(--green);flex:none;margin:0}
.item .body{flex:1;border:0;background:transparent;text-align:left;padding:2px 0;min-width:0;color:var(--ink)}
.item .body .tt{word-wrap:break-word}
.item .body .q{font-weight:700;color:var(--accent);margin-right:4px}
.item .body .mt{font-size:12px;color:var(--muted)}
.item.done .tt{text-decoration:line-through;color:var(--muted)}
.item.done .q{color:var(--muted)}
.late{color:var(--danger);font-weight:600}
.listbar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin:4px 0 12px;flex-wrap:wrap}

/* ricette, scadenze, bambini */
.rc{display:block;width:100%;text-align:left;border:0;color:var(--ink)}
.rc .ttl{font-weight:700;font-size:16.5px}
.ingl{margin:0;padding-left:20px} .ingl li{margin:3px 0}
.proc{white-space:pre-wrap}
.dishes{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.dishes label{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:14px}
.dishes input{margin-top:3px}
.sc{display:flex;gap:12px;align-items:center;border-left:6px solid var(--green)}
.sc.warn{border-left-color:var(--glow)} .sc.late{border-left-color:var(--danger)}
.sc .when{font-size:13px;color:var(--muted)}
.sc .body{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0;color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.sched{width:100%;border-collapse:collapse;font-size:14.5px}
.sched td{padding:7px 4px;border-top:1px solid var(--line);vertical-align:top}
.sched td:first-child{color:var(--muted);width:44px;font-weight:600}
.sched tr.now td{background:var(--accent-soft)}
.vx{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.vx input{width:22px;height:22px;accent-color:var(--green);margin:0}
.vx .body{flex:1;border:0;background:none;text-align:left;padding:0;color:var(--ink)}
.vx.done .t{text-decoration:line-through;color:var(--muted)}
.order li{display:flex;align-items:center;gap:6px;padding:6px 0;border-top:1px solid var(--line)}
.order{list-style:none;margin:0;padding:0}
.order li span{flex:1}

/* menu: modifica pasti */
.melist{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.mepick{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 12px;font-size:14px;color:var(--ink)}
.mepick:last-child{border-bottom:0}
.mepick:hover{background:var(--accent-soft)}
.pcell{border:0;background:none;padding:0;text-align:left;color:var(--ink);font:inherit;width:100%}
.pcell:hover{color:var(--accent)}
/* budget */
.budtot{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:2px 0 8px}
.bar{height:10px;border-radius:99px;background:var(--bg);overflow:hidden}
.bar.thin{height:7px;margin:4px 0 10px}
.bar i{display:block;height:100%;border-radius:99px}
.bitem{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:9px 0;border-top:1px solid var(--line);color:var(--ink)}
.bitem .bic{width:36px;height:36px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:none}
.bitem b{white-space:nowrap}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end}
.mcol{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;border-radius:10px;color:var(--ink)}
.mcol.on{background:var(--accent-soft)}
.mcol .mv{font-size:10.5px;color:var(--muted);white-space:nowrap}
.mcol .mb{height:70px;width:60%;display:flex;align-items:flex-end;background:var(--bg);border-radius:6px;overflow:hidden}
.mcol .mb i{display:block;width:100%;background:var(--green);border-radius:6px 6px 0 0}
.mcol .ml{font-size:12px;font-weight:600;text-transform:capitalize}
input.bigin{font-size:24px;font-weight:700}
/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(10,14,24,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
@media (min-width:600px){.ov{align-items:center}}
.modal{background:var(--card);width:100%;max-width:540px;border-radius:22px 22px 0 0;padding:18px 16px 22px;max-height:92vh;overflow:auto}
@media (min-width:600px){.modal{border-radius:22px}}
.modal h2{margin:0 0 6px;font-size:19px}
.modal .acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.sync.off{background:var(--ink);color:var(--bg)}
.sync{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));font-size:12px;color:var(--muted);background:var(--card);padding:5px 10px;border-radius:999px;box-shadow:var(--shadow);z-index:40}
.loading{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header class="top"><div class="in">
  <button class="iconbtn" id="back" aria-label="Indietro" style="display:none">&#8592;</button>
  <h1 id="title">La nostra casa</h1>
  <button class="iconbtn" id="refresh" aria-label="Aggiorna" title="Aggiorna">&#8635;</button>
  <button class="iconbtn" id="gear" aria-label="Impostazioni" title="Impostazioni">&#9881;</button>
</div></header>
<div class="app"><div id="main"><div class="loading">Caricamento…</div></div></div>
<div id="modal"></div>
<div id="toast"></div>
<div id="sync" class="sync" style="display:none">Sincronizzo…</div>
<script src="config.js"></script>
<script>
var COLAZIONE = "Toast con burro d'arachidi e Nutella / Latte e cereali / Budino / Latte e biscotti";
var GIORNI = ['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
var PASTI = [
  {k:'mm', nome:'Merenda del mattino', ic:'🍎'},
  {k:'pr', nome:'Pranzo', ic:'🍝'},
  {k:'mp', nome:'Merenda del pomeriggio', ic:'🥨'},
  {k:'ce', nome:'Cena', ic:'🍲'}
];
var PLAN = [
 { // SETTIMANA 1
  mm:["Frutta fresca di stagione","Taralli all'olio extravergine","Cubetti di Parmigiano + 1 frutto piccolo","Frutta fresca di stagione","Yogurt bianco naturale","Frutta fresca di stagione","Frutta secca + Frutta fresca"],

/* =========================================================
   COLLEGAMENTO CON IL MOTORE DATI (Google Apps Script)
   L'app funziona anche offline: i dati restano sul telefono
   e le modifiche aspettano in coda finché torna internet.
   ========================================================= */
function apiUrl(){
  var u = (typeof window.API_URL==='string') ? window.API_URL.trim() : '';
  if (!/^https?:\/\//.test(u)) u = lsGet('casa_api','');
  return /^https?:\/\//.test(u) ? u : '';
}
function rawCall(fn, args, op){
  var url=apiUrl();
  if (!url){ var e0=new Error('Manca il link del motore dati'); e0.server=true; return Promise.reject(e0); }
  var ctl = window.AbortController ? new AbortController() : null, timer = ctl ? setTimeout(function(){ ctl.abort(); }, 30000) : null;
  return fetch(url, {method:'POST', body:JSON.stringify({fn:fn, args:args||[], op:op||null}), headers:{'Content-Type':'text/plain;charset=utf-8'}, redirect:'follow', signal:ctl?ctl.signal:undefined})
    .then(function(r){ if(timer) clearTimeout(timer); return r.text(); },
          function(){ if(timer) clearTimeout(timer); var e=new Error('Sei offline'); e.offline=true; throw e; })
    .then(function(t){
      var j; try { j=JSON.parse(t); } catch(x){ var eb=new Error('Risposta non valida dal server'); eb.bad=true; throw eb; }
      setOnline(true);
      if (!j.ok){ var es=new Error(j.error||'Errore'); es.server=true; throw es; }
      return j.result;
    });
}
function call(fn){ return rawCall(fn, Array.prototype.slice.call(arguments,1), null); }

/* ---------- coda delle modifiche (resta salvata sul telefono) ---------- */
var Q = lsGet('casa_queue', []), Qwait = {}, qBusy = false, qRun = 0, retryT = null;
function qSave(){ lsSet('casa_queue', Q); updateSync(); }
function enqueue(fn, args){
  var id = uid();
  Q.push({id:id, fn:fn, args:args||[], tries:0}); qSave();
  var p = new Promise(function(res,rej){ Qwait[id] = {res:res, rej:rej}; });
  setTimeout(processQ, 0);
  return p;
}
function scheduleRetry(){ if (!retryT) retryT = setTimeout(function(){ retryT=null; processQ(); }, 15000); }
function queueDrained(lastRes){
  var single = qRun===1; qRun = 0;
  if (single && lastRes && lastRes.data) applyRes(lastRes); else reloadAll();
  S.evLoading=false; loadEvents(true);
}
function processQ(){
  if (qBusy || !Q.length) { updateSync(); return; }
  qBusy = true; updateSync();
  var it = Q[0];
  rawCall(it.fn, it.args, it.id).then(function(res){
    Q.shift(); qRun++; qBusy=false; qSave();
    var w = Qwait[it.id]; delete Qwait[it.id];
    if (!Q.length) queueDrained(res);
    if (w) w.res(res);
    processQ();
  }, function(e){
    qBusy = false;
    if (e.offline){ setOnline(false); scheduleRetry(); return; }
    it.tries++;
    if (e.server || it.tries>=5){
      Q.shift(); qSave();
      var w = Qwait[it.id]; delete Qwait[it.id];
      toast('Non salvato: '+errMsg(e));
      if (w) w.rej(e);
      if (!Q.length) queueDrained(null);
      processQ();
    } else { qSave(); scheduleRetry(); }
  });
}

/* =========================================================

   ========================================================= */
function pad(n){ return (n<10?'0':'')+n; }
function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseYmd(s){ var a=String(s).split('-'); return new Date(+a[0],+a[1]-1,+a[2]); }
function addDays(d,n){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n); }
function today(){ var d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function dayDiff(a,b){ return Math.round((Date.UTC(b.getFullYear(),b.getMonth(),b.getDate())-Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()))/864e5); }
function wdIdx(d){ return (d.getDay()+6)%7; }
function mondayOf(d){ return addDays(d,-wdIdx(d)); }
var MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
function cap(s){ s=String(s||''); return s.charAt(0).toUpperCase()+s.slice(1); }
function fmtLong(d){ return GIORNI[wdIdx(d)].toLowerCase()+' '+d.getDate()+' '+MESI[d.getMonth()]; }
function fmtShort(d){ return GIORNI[wdIdx(d)].slice(0,3).toLowerCase()+' '+d.getDate()+' '+MESI[d.getMonth()].slice(0,3); }
function fmtDate(s){ if(!s) return ''; var d=parseYmd(s); return d.getDate()+' '+MESI[d.getMonth()].slice(0,3)+' '+d.getFullYear(); }
function relDay(d){ var n=dayDiff(today(),d); if(n===0) return 'Oggi · '+fmtLong(d); if(n===1) return 'Domani · '+fmtLong(d); return cap(fmtLong(d)); }
function inGiorni(s){ var n=dayDiff(today(),parseYmd(s)); if(n===0) return 'oggi'; if(n===1) return 'domani'; if(n===-1) return 'ieri'; return n>0 ? 'tra '+n+' giorni' : n*-1+' giorni fa'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function uid(){ return Math.random().toString(36).slice(2,8)+Date.now().toString(36); }
function norm(s){ return String(s||'').toLowerCase().replace(/\s+/g,' ').trim(); }
function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function opts(list, sel){ return list.map(function(o){ var v=Array.isArray(o)?o[0]:o, l=Array.isArray(o)?o[1]:o; return '<option value="'+esc(v)+'"'+(String(v)===String(sel)?' selected':'')+'>'+esc(l)+'</option>'; }).join(''); }
function val(id){ var e=document.getElementById(id); return e ? e.value : ''; }
function checked(id){ var e=document.getElementById(id); return !!(e && e.checked); }
function fmtQta(q,u){ if(!q && q!==0) return ''; var s=String(q).replace('.',','); if(!u) return s+' ×'; if(u==='pz'||u==='conf') return s+' '+u; return s+u; }
/* "500g pollo", "1,5 l latte", "2 pz uova" -> {qta, unita, testo} */
function parseQta(t){
  var m = String(t).trim().match(/^(\d+(?:[.,]\d+)?)\s*(kg|g|gr|ml|l|lt|pz|conf)?\.?\s+(.+)$/i);
  if (!m) return {qta:'', unita:'', testo:String(t).trim()};
  var u=(m[2]||'').toLowerCase(); if(u==='gr') u='g'; if(u==='lt') u='l';
  return {qta:m[1].replace('.',','), unita:u, testo:m[3].trim()};
}

}

}

  call('getRev').then(function(r){ if (r && r!==S.rev && !Q.length) reloadAll().catch(function(){}); }).catch(function(e){ if (e.offline) setOnline(false); });

function cycleInfo(d){
  var idx = ((dayDiff(parseYmd(S.settings.menuStart), d) % 28) + 28) % 28;
  return {idx:idx, w:Math.floor(idx/7), d:idx%7, start:addDays(d,-idx)};

function planKey(w,d,k){ return w+'-'+d+'-'+k; }
function planEdits(){
  if (S._peSrc!==S.piano){ S._pe={}; (S.piano||[]).forEach(function(p){ S._pe[p.id]=p.text; }); S._peSrc=S.piano; }

}

function extraByName(t){ var n=norm(t); return (S.piatti||[]).filter(function(p){ return norm(p.nome)===n; })[0] || null; }
function comps(text){ return String(text).split(' + ').map(function(s){ return s.trim(); }).filter(Boolean); }
var ALL_COMPS = (function(){ var s={}; PLAN.forEach(function(w){ ['mm','pr','mp','ce'].forEach(function(k){ w[k].forEach(function(t){ comps(t).forEach(function(c){ s[c]=1; }); }); }); }); return Object.keys(s).sort(function(a,b){return a.localeCompare(b,'it');}); })();

/* ---------- rotazione dei piatti extra: stessa scelta su tutti i telefoni ---------- */
function hashStr(s){ var h=2166136261; for (var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; var t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function rotEligible(){ return (S.piatti||[]).filter(function(p){ return (p.pasti||[]).some(function(k){ return k==='pr'||k==='ce'; }); }); }
function rotActive(){ return (+S.settings.rotExtra||0)>0 && rotEligible().length>=3; }
var _rotCache={};
function weekExtras(monday){
  var n=+S.settings.rotExtra||0, el=rotEligible();
  var sig=ymd(monday)+'|'+n+'|'+el.map(function(p){ return p.id+(p.senzaCarne?'v':'')+(p.pasti||[]).join(''); }).sort().join(',');
  if (_rotCache[sig]) return _rotCache[sig];
  var out={};
  if (n>0 && el.length>=3){
    var r=rng(hashStr(sig)), slots=[];
    for (var d=0; d<7; d++){ slots.push({d:d,k:'pr'}); slots.push({d:d,k:'ce'}); }
    for (var i=slots.length-1;i>0;i--){ var j=Math.floor(r()*(i+1)), t=slots[i]; slots[i]=slots[j]; slots[j]=t; }
    var used={}, cnt=0;
    slots.forEach(function(s){
      if (cnt>=n) return;
      var ok=el.filter(function(p){ return !used[p.id] && (p.pasti||[]).indexOf(s.k)>=0 && (s.d!==4 || p.senzaCarne); });
      if (!ok.length) return;
      var p=ok[Math.floor(r()*ok.length)]; used[p.id]=1; out[s.d+'|'+s.k]=p; cnt++;
    });
  }
  _rotCache[sig]=out; return out;
}
function extraFor(date,k){ if (k!=='pr' && k!=='ce') return null; return weekExtras(mondayOf(date))[wdIdx(date)+'|'+k] || null; }

/* cosa si mangia in un giorno: 1) modifica/alternativa del giorno 2) piatto extra 3) modifica del piano 4) originale */
function mealFor(date,k){
  var c=cycleInfo(date), base=mealText(c.w,c.d,k), orig=origText(c.w,c.d,k), sw=(S.settings.swaps||{})[ymd(date)+'|'+k];
  var r={w:c.w, d:c.d, base:base, orig:orig, edited:base!==orig, swap:null, manual:false, extra:null, rot:false};
  if (sw && sw.text){ r.text=sw.text; r.swap=sw; r.manual=true; r.extra=extraByName(sw.text); return r; }
  if (sw){ r.text=mealText(sw.w,sw.d,k); r.swap=sw; r.w=sw.w; r.d=sw.d; return r; }
  var ex=extraFor(date,k);
  if (ex){ r.text=ex.nome; r.extra=ex; r.rot=true; return r; }
  r.text=base; return r;
}

    return '<button class="tile c-'+t.id+'" data-act="go" data-v="'+t.id+'"><div class="ic">'+t.ic+'</div><b>'+t.t+'</b><small>'+esc(t.sub())+'</small></button>';
  }).join('')+'</div>';

};
function todayCard(){
  var td=today(), ds=ymd(td), out='';
  function sec(ic,lb,body,v){ return '<div class="tsec"><div class="ti">'+ic+'</div><div class="tb"><button class="lnk" data-act="go" data-v="'+v+'"><div class="lb">'+lb+'</div>'+body+'</button></div></div>'; }
  // impegni
  var evs = S.evKey ? eventsOn(ds) : null;
  out += sec('📅','Impegni di oggi', evs==null ? '<span style="opacity:.7">…</span>' : (evs.length ? evs.map(function(e){ return '<div>'+(e.allDay?'':'<b>'+esc(e.oraInizio)+'</b> ')+esc(e.titolo)+'</div>'; }).join('') : '<div style="opacity:.8">Nessun impegno</div>'), 'agenda');
  // pasti
  out += sec('🍽️','Pranzo e cena','<div><b>Pranzo:</b> '+esc(mealFor(td,'pr').text)+'</div><div><b>Cena:</b> '+esc(mealFor(td,'ce').text)+'</div>','menu');
  // da fare in scadenza
  var due = S.todo.filter(function(x){ return !x.fatto && x.scadenza && x.scadenza<=ds; }).sort(function(a,b){ return a.scadenza.localeCompare(b.scadenza); });
  if (due.length) out += sec('✅','Da fare entro oggi', due.slice(0,3).map(function(x){ return '<div class="'+(x.scadenza<ds?'late':'')+'">'+esc(x.testo)+(x.scadenza<ds?' (scaduto)':'')+(x.assegnato?' · '+esc(x.assegnato):'')+'</div>'; }).join('')+(due.length>3?'<div style="opacity:.7">e altre '+(due.length-3)+'</div>':''),'todo');
  // scadenze vicine
  var sc = scadSorted().filter(function(s){ return dayDiff(td,parseYmd(s.data)) <= (+s.avviso||7); });
  if (sc.length) out += sec('⏰','Scadenze vicine', sc.slice(0,3).map(function(s){ var n=dayDiff(td,parseYmd(s.data)); return '<div class="'+(n<0?'late':'')+'">'+esc(s.titolo)+' · '+esc(inGiorni(s.data))+'</div>'; }).join(''),'scadenze');
  // scuola
  var wi=wdIdx(td);
  if (wi<6){
    var sch = S.bambini.filter(function(b){ return b.orario && b.orario[wi]; });
    if (sch.length) out += sec('🎒','Oggi a scuola', sch.map(function(b){ return '<div><b>'+esc(b.nome)+':</b> '+esc(b.orario[wi])+'</div>'; }).join(''),'bambini');
  }
  return '<div class="today-card"><h2><span class="dot"></span>Oggi</h2>'+out+'</div>';
}

function menuDay(){ return addDays(today(), S.menuOff); }
function mealNote(m){
  if (m.manual) return '✏️ Cambiato'+(m.swap.autore?' da '+esc(m.swap.autore):'')+' solo per questo giorno';
  if (m.swap) return 'Alternativa'+(m.swap.autore?' scelta da '+esc(m.swap.autore):'')+' · presa da settimana '+(m.w+1)+', '+GIORNI[m.d].toLowerCase();
  if (m.rot) return '🎲 Piatto extra della settimana · al posto di: '+esc(m.base);
  if (m.edited) return '✏️ Modificato nel piano · originale: '+esc(m.orig);
  return '';
}

  });

  html += '<button class="btn block" data-act="go" data-v="piatti" style="margin:2px 0 12px">🍳 I nostri piatti extra'+(np?' ('+np+')':'')+(rotActive()?' · rotazione attiva 🎲':'')+'</button>';

  return html;

ACT.mday = function(el){ var n=+el.getAttribute('data-n'); S.menuOff = n===0?0:S.menuOff+n; render(); };
function setDaySwap(date,k,val,msg){
  var key=ymd(date)+'|'+k;
  return save('setSwap',[ymd(date),k,val,S.name], function(){
    S.settings.swaps=S.settings.swaps||{};
    if (val) S.settings.swaps[key]= val.text ? {text:val.text, autore:S.name} : {w:val.w, d:val.d, autore:S.name};
    else delete S.settings.swaps[key];
  }, msg).catch(function(){});
}
ACT.alt = function(el){
  var k=el.getAttribute('data-k'), day=menuDay(), c=cycleInfo(day), m=mealFor(day,k), cand=[], seen={};
  seen[norm(m.text)]=1; seen[norm(m.base)]=1;
  for (var w=0; w<4; w++){
    if (w===c.w) continue;
    for (var d=0; d<7; d++){
      if (c.d===4 && d!==4) continue;            // venerdì: solo da altri venerdì (niente carne)
      var t=mealText(w,d,k);
      if (seen[norm(t)]) continue;
      seen[norm(t)]=1; cand.push({w:w,d:d});
    }
  }
  (S.piatti||[]).forEach(function(p){
    if ((p.pasti||[]).indexOf(k)<0 || (c.d===4 && !p.senzaCarne) || seen[norm(p.nome)]) return;
    seen[norm(p.nome)]=1; cand.push({text:p.nome});
  });
  if (!cand.length){ toast('Nessun’altra alternativa disponibile'); return; }
  setDaySwap(day, k, cand[Math.floor(Math.random()*cand.length)]);
};
ACT.orig = function(el){ setDaySwap(menuDay(), el.getAttribute('data-k'), null); };
ACT.noExtra = function(el){ var k=el.getAttribute('data-k'), m=mealFor(menuDay(),k); setDaySwap(menuDay(), k, {text:m.base}, 'Torna il piatto del piano'); };

/* ---------- cambiare un pasto a mano ---------- */
function mealChoices(k){
  var s={}, out=[];
  for (var w=0; w<4; w++) for (var d=0; d<7; d++){ var t=mealText(w,d,k); if(!s[norm(t)]){ s[norm(t)]=1; out.push({t:t, x:false}); } }
  (S.piatti||[]).forEach(function(p){ if ((p.pasti||[]).indexOf(k)>=0 && !s[norm(p.nome)]){ s[norm(p.nome)]=1; out.push({t:p.nome, x:true}); } });
  return out.sort(function(a,b){ return (b.x-a.x) || a.t.localeCompare(b.t,'it'); });
}
function meList(){
  var q=norm(val('meT')), list=mealChoices(S.me.k).filter(function(o){ return !q || norm(o.t).indexOf(q)>=0; }).slice(0,40);

}

/* ---------- ingredienti del menu -> spesa ---------- */
function ingNames(m){
  var ex = m.extra || extraByName(m.text);
  if (ex){
    var l=String(ex.ingredienti||'').split('\n').map(function(s){ return s.trim(); }).filter(Boolean).map(function(x){
      var pq=parseQta(x.replace(/^[-•*]\s*/,'')), n=cap(pq.testo), k=known(n); return k?k.nome:n; });
    return l.length ? l : [ex.nome];
  }
  var out=[]; comps(m.text).forEach(function(c){ (COMP[c] || c).split('|').forEach(function(n){ out.push(n); }); });
  return out;
}
function ingredientsFor(range){
  var days = range==='oggi' ? [today()] : range==='domani' ? [addDays(today(),1)] : [0,1,2,3,4,5,6].map(function(i){ return addDays(today(),i); });
  var map={}, order=[];
  days.forEach(function(d){
    PASTI.forEach(function(p){
      ingNames(mealFor(d,p.k)).forEach(function(n){ var k=norm(n); if(!map[k]){ map[k]={nome:n, n:0}; order.push(k); } map[k].n++; });
    });
  });
  return order.map(function(k){ return map[k]; });
}
function ingModal(){
  var r=S.ingRange, list=ingredientsFor(r), inList={};
  S.spesa.forEach(function(x){ if(!x.fatto) inList[norm(x.testo)]=1; });
  var groups={};
  list.forEach(function(it){ var c=catOf(it.nome); (groups[c]=groups[c]||[]).push(it); });
  var html='<h2>Ingredienti alla spesa</h2><div class="chips" style="margin:6px 0 10px">'+
    [['oggi','Oggi'],['domani','Domani'],['sett','Prossimi 7 giorni']].map(function(o){ return '<button class="pill'+(r===o[0]?' on':'')+'" data-act="ingRange" data-r="'+o[0]+'">'+o[1]+'</button>'; }).join('')+'</div>'+
    '<p class="small muted" style="margin:0 0 6px">Togli la spunta a ciò che avete già in casa.</p>';
  var cats=catsFor('spesa'); Object.keys(groups).forEach(function(c){ if (cats.indexOf(c)<0) cats.push(c); });
  cats.forEach(function(c){
    if (!groups[c]) return;
    html+='<div style="margin-top:10px"><b class="small">'+esc(c)+'</b>';
    groups[c].forEach(function(it){
      var already=inList[norm(it.nome)];
      html+='<label class="chk" style="margin:6px 0 0"><input type="checkbox" class="ingc" data-n="'+esc(it.nome)+'" '+(already?'':'checked')+'> <span>'+esc(it.nome)+(it.n>1?' <span class="muted small">×'+it.n+' pasti</span>':'')+(already?' <span class="chip gray">già in lista</span>':'')+'</span></label>';
    });
    html+='</div>';
  });
  html+='<div style="margin-top:12px"><b class="small">Colazione</b>'+COLAZ_ING.split('|').map(function(n){ var already=inList[norm(n)]; return '<label class="chk" style="margin:6px 0 0"><input type="checkbox" class="ingc" data-n="'+esc(n)+'"> <span>'+esc(n)+(already?' <span class="chip gray">già in lista</span>':'')+'</span></label>'; }).join('')+'</div>';
  html+='<div class="acts"><span class="grow"></span><button class="btn ghost" data-act="close">Annulla</button><button class="btn primary" data-act="ingAdd">Aggiungi alla spesa</button></div>';
  openModal(html);
}

function catsFor(type){

  return ord;
}

  list.splice(list.indexOf('Altro'),0,name);

var DIZ_MAP = (function(){ var m={}; Object.keys(DIZ).forEach(function(c){ DIZ[c].split('|').forEach(function(n){ var i=COMUNI.indexOf(n); m[norm(n)]={nome:n, cat:c, n:0, last:0, pop: i<0 ? 0 : 100-i}; }); }); return m; })();
function acAll(){
  var m={}, k;
  for (k in DIZ_MAP) m[k]={nome:DIZ_MAP[k].nome, cat:DIZ_MAP[k].cat, n:0, last:0, pop:DIZ_MAP[k].pop};
  (S.prodotti||[]).forEach(function(p){ m[p.id]={nome:p.nome, cat:p.categoria||'Altro', n:p.n||0, last:p.last||0, pop:(DIZ_MAP[p.id]||{}).pop||0}; });
  return m;
}
function known(nome){ return acAll()[norm(nome)] || null; }
function catOf(nome){ var k=known(nome); return k ? k.cat : (guessCat(nome)||'Altro'); }
function acMatches(q){
  q=norm(q); if(!q) return [];
  var all=acAll(), pre=[], word=[];
  Object.keys(all).forEach(function(k){ var p=all[k]; if (k.indexOf(q)===0) pre.push(p); else if ((' '+k).indexOf(' '+q)>=0) word.push(p); });
  function srt(a,b){ return (b.n-a.n) || (b.pop-a.pop) || (a.nome.length-b.nome.length) || a.nome.localeCompare(b.nome,'it'); }
  return pre.sort(srt).concat(word.sort(srt)).slice(0,8);
}

/* stessa regola del server: avanza finché la data non è nel futuro */
function nextDateC(ds, ric){
  var M={'mese':1,'2mesi':2,'3mesi':3,'6mesi':6,'anno':12,'2anni':24,'5anni':60,'10anni':120}, D={'settimana':7,'2settimane':14};
  var d=parseYmd(ds), t=today(), g=0;
  if (!M[ric] && !D[ric]) return ds;
  do {
    if (D[ric]) d=addDays(d,D[ric]);
    else { var y=d.getFullYear(), m=d.getMonth()+M[ric], day=d.getDate(), last=new Date(y,m+1,0).getDate(); d=new Date(y,m,Math.min(day,last)); }
  } while (d<t && ++g<500);
  return ymd(d);
};

    var nm=enc.encode(f.name), d=f.data, c=crc32(d);
    var h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint16(8,0,true); h.setUint16(10,0,true); h.setUint16(12,0x21,true);
    h.setUint32(14,c,true); h.setUint32(18,d.length,true); h.setUint32(22,d.length,true); h.setUint16(26,nm.length,true); h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer), nm, d);
    var ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,0x21,true);
    ch.setUint32(16,c,true); ch.setUint32(20,d.length,true); ch.setUint32(24,d.length,true); ch.setUint16(28,nm.length,true);
    ch.setUint16(30,0,true); ch.setUint16(32,0,true); ch.setUint16(34,0,true); ch.setUint16(36,0,true); ch.setUint32(38,0,true); ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer), nm);
    off += 30+nm.length+d.length;
  });
  var cs=central.reduce(function(t,b){ return t+b.length; },0), e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cs,true); e.setUint32(16,off,true);
  return new Blob(parts.concat(central,[new Uint8Array(e.buffer)]),{type:type});
}

/* =========================================================
   EVENTI DELL'INTERFACCIA
   ========================================================= */
ACT.go = function(el){ var v=el.getAttribute('data-v'); if (v==='plan') S.planWeek=null; go(v); };
ACT.close = function(){ closeModal(); };
document.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-act]'); if(!el) return;
  var a = el.getAttribute('data-act');
  if (a==='ovclose'){ if (ev.target===el) closeModal(); return; }
  if (el.tagName==='A') ev.preventDefault();
  if (el.disabled) return;
  if (ACT[a]) ACT[a](el, ev);
});
/* evita che la tendina dei suggerimenti si chiuda prima del tocco */
['mousedown','pointerdown'].forEach(function(t){ document.addEventListener(t, function(e){ if (e.target.closest && e.target.closest('.ac')) e.preventDefault(); }); });

document.addEventListener('change', function(ev){
  var t=ev.target;
  if ((t.id==='edC' || t.id==='tdC') && t.value==='__new') { askNewCat(t); return; }
  if (t.id==='edC' || t.id==='tdC') t.setAttribute('data-prev', t.value);
  if (t.id==='evAD'){
    document.getElementById('evTimes').style.display = t.checked?'none':'';
    document.getElementById('evDFw').style.display = t.checked?'':'none';
    var p=document.getElementById('evP'); if (p) p.innerHTML = remOptions(t.checked, t.checked?'900':'1440,60');
  }
  if (t.id==='evR'){ var f=document.getElementById('evRF'); if(f) f.style.display = t.value?'':'none'; }
  if (t.id==='evD'){ var df=document.getElementById('evDF'); if(df && (df.value<t.value || !checked('evAD'))) df.value=t.value; }
  if (t.id==='rotSel'){ var rn=+t.value; save('setRotazione',[rn], function(){ S.settings.rotExtra=rn; }, rn?'Rotazione: '+rn+' a settimana':'Rotazione spenta').catch(function(){}); }
  if (t.id==='themeSel'){ S.theme=t.value; lsSet('casa_theme',S.theme); applyTheme(); }
  if (t.getAttribute('data-act-change')==='prCat'){
    var id=t.getAttribute('data-id'), p=(S.prodotti||[]).filter(function(x){return x.id===id;})[0];
    if (p) save('saveProdotto',[{id:id, nome:p.nome, categoria:t.value}], function(){ p.categoria=t.value; }).catch(function(){});
  }
});
document.addEventListener('input', function(ev){
  var t=ev.target;
  if (t.id==='addT'){ S.acIdx=-1; acRender(); }
  if (t.id==='ricQ'){ S.ricQ=t.value; var l=document.getElementById('ricList'); if(l) l.innerHTML=ricList(); }
  if (t.id==='prQ'){ S.prQ=t.value; var pos=t.selectionStart; render(); var n=document.getElementById('prQ'); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} } }
  if (t.id==='bdD') budSuggest(t.value);
  if (t.id==='meT'){ var ml=document.getElementById('meL'); if(ml) ml.innerHTML=meList(); }
  if (t.id==='dishQ'){ var q=norm(t.value); [].forEach.call(document.querySelectorAll('#dishes label'), function(l){ l.style.display = !q || norm(l.textContent).indexOf(q)>=0 ? '' : 'none'; }); }
});
document.addEventListener('keydown', function(ev){
  var t=ev.target;
  if (t.id==='addT'){
    var n=(S.acList||[]).length, box=document.getElementById('ac'), open=box && box.style.display!=='none';
    if (ev.key==='ArrowDown' && open){ ev.preventDefault(); S.acIdx=Math.min(n-1,(S.acIdx==null?-1:S.acIdx)+1); acRender(); return; }
    if (ev.key==='ArrowUp' && open){ ev.preventDefault(); S.acIdx=Math.max(-1,(S.acIdx||0)-1); acRender(); return; }
    if (ev.key==='Enter'){
      ev.preventDefault();
      if (open && S.acIdx>=0 && S.acList[S.acIdx]) { var b=box.querySelector('[data-i="'+S.acIdx+'"]'); if(b) ACT.acPick(b); }
      else ACT.addSpesa();
      return;
    }
    if (ev.key==='Escape'){ acClose(); return; }
  }
  if (ev.key==='Enter' && t.id==='addQ'){ ev.preventDefault(); ACT.addSpesa(); }
  if (ev.key==='Enter' && t.id==='addTodo'){ ev.preventDefault(); ACT.addTodo(); }
  if (ev.key==='Enter' && t.id==='nameIn'){ ev.preventDefault(); ACT.saveName(); }
  if (ev.key==='Enter' && t.id==='chN' && !document.querySelector('.ov')){ ev.preventDefault(); ACT.addChild(); }
  if (ev.key==='Enter' && t.id==='catNew'){ ev.preventDefault(); ACT.catAdd(); }
  if (ev.key==='Escape') closeModal();
});
document.addEventListener('focusout', function(ev){ if (ev.target.id==='addT') setTimeout(acClose, 200); });
document.getElementById('back').onclick=function(){ if (history.state && history.state.v && history.state.v!=='home') history.back(); else go('home'); };
document.getElementById('gear').onclick=function(){ go('settings'); };
document.getElementById('refresh').onclick=function(){ if (Q.length){ processQ(); toast(S.online?'Invio le modifiche…':'Sei offline: le modifiche partiranno appena torna internet'); return; } reloadAll().then(function(){ toast('Aggiornato'); }, function(){}); S.evLoading=false; loadEvents(); };

/* tasto indietro del telefono */
window.addEventListener('popstate', function(e){
  if (document.querySelector('.ov')){ closeModal(); try{ history.pushState({v:S.view},'','#'+S.view); }catch(x){} return; }
  S.stack.pop(); go((e.state && e.state.v) || 'home', false);
});

/* rete: quando torna internet si inviano le modifiche in coda */
window.addEventListener('online', function(){ setOnline(true); processQ(); poll(); });
window.addEventListener('offline', function(){ setOnline(false); });

/* sincronizzazione: controlla le modifiche ogni 15 secondi, l'agenda ogni minuto */
setInterval(poll, 15000);
setInterval(function(){ if (!document.hidden && (S.view==='agenda'||S.view==='home')) loadEvents(true); }, 60000);
document.addEventListener('visibilitychange', function(){ if(!document.hidden){ processQ(); poll(); loadEvents(true); applyTheme(); } });

/* service worker: l'app resta sul telefono e si apre anche senza internet */
if ('serviceWorker' in navigator && location.protocol!=='file:') navigator.serviceWorker.register('sw.js').catch(function(){});

/* avvio: prima i dati salvati sul telefono, poi l'aggiornamento dal server */
function setupScreen(){
  $main.innerHTML='<div class="card"><h2>Collega l’app</h2><p class="small muted">Incolla il link del motore dati: in Apps Script, «Esegui il deployment → Gestisci deployment», il link che finisce con <b>/exec</b>. (Meglio ancora: scrivilo nel file <b>config.js</b> su GitHub, così vale per tutti i telefoni.)</p><input type="text" id="apiIn" placeholder="https://script.google.com/macros/s/…/exec"><button class="btn primary block" style="margin-top:10px" data-act="apiSave">Collega</button></div>';
}
ACT.apiSave = function(){ var u=val('apiIn').trim(); if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(u)){ toast('Il link deve iniziare con https://script.google.com e finire con /exec'); return; } lsSet('casa_api',u); location.reload(); };
history.replaceState({v:'home'},'','#home');
updateSync();
var hadData = restore();
if (hadData) render();
if (!apiUrl()) setupScreen();
else if (Q.length) processQ();
else {
  if (hadData) S.loading=true, updateSync();
  call('bootstrap').then(function(res){
    S.loading=false; if (!Q.length) applyRes(res); render(); S.evLoading=false; loadEvents(true);
  }).catch(function(e){
    S.loading=false;
    if (e.offline) setOnline(false); else toast('Errore: '+errMsg(e));
    updateSync();
    if (!hadData) $main.innerHTML='<div class="card"><h2>Serve internet</h2><p class="muted">Al primo avvio l’app deve scaricare i dati. Dopo funzionerà anche offline.</p><p class="small muted">'+esc(errMsg(e))+'</p><button class="btn primary" onclick="location.reload()">Riprova</button></div>';
  });
}
</script>
